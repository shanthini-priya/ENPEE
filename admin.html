<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="enpee-base-path" content="">
  <meta name="enpee-api-base" content="">
  <title>ENPEE CMS · Admin</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #1E61AC;
      --sky: #06A9E4;
      --green: #68B82E;
      --bg: #F4F7FA;
      --white: #FFFFFF;
      --ink: #173B65;
      --mute: #687786;
      --line: #E2E8F0;
      --red: #b64040;
      --shadow: 0 12px 34px rgba(30, 97, 172, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.55 Inter, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Login */
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #f6f8f2, #eef3f6);
    }

    .login-card {
      width: min(440px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 36px;
      box-shadow: var(--shadow);
    }

    .brand {
      font-family: Georgia, serif;
      color: var(--navy);
      font-size: 25px;
      font-weight: bold;
      text-decoration: none;
    }

    .brand small {
      display: block;
      color: var(--sky);
      font: 700 10px system-ui;
      letter-spacing: .18em;
      margin-top: 3px;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 15px 0 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d5dee5;
      background: #fff;
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--ink);
    }

    .error {
      color: var(--red);
      margin-top: 10px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      padding: 11px 16px;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn:hover {
      background: #244e73;
    }

    .btn.green {
      background: var(--green);
      color: #183653;
    }

    .btn.light {
      background: #edf2f5;
      color: var(--navy);
    }

    .btn.danger {
      background: #fff0f0;
      color: var(--red);
    }

    .btn.small {
      padding: 7px 10px;
      font-size: 12px;
    }

    .btn.full {
      width: 100%;
      margin-top: 20px;
    }

    /* App Shell */
    .portal-header {
      background: var(--navy);
      color: #fff;
      padding: 18px max(20px, calc((100vw - 1200px)/2));
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .portal-header .brand {
      color: #fff;
    }

    .portal-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-pill {
      background: rgba(255, 255, 255, .12);
      border-radius: 50px;
      padding: 8px 13px;
    }

    .logout {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .2);
      padding: 10px 15px;
      border-radius: 8px;
    }

    .cms-primary-modules-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      max-width: 1240px;
      margin: 18px auto;
      padding: 0 20px;
    }

    .cms-module-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      text-decoration: none;
      color: var(--ink);
      transition: all .2s;
      cursor: pointer;
    }

    .cms-module-btn:hover,
    .cms-module-btn.active {
      background: #EFF6FF;
      border-color: var(--navy);
      transform: translateY(-1px);
    }

    .cms-module-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--navy);
      line-height: 1.25;
    }

    .cms-module-sub {
      font-size: 11px;
      color: var(--mute);
      margin-top: 2px;
    }

    /* Content */
    .content {
      max-width: 1240px;
      margin: auto;
      padding: 0 20px 56px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .section-heading h2 {
      font: 600 26px Georgia;
      color: var(--navy);
      margin: 0;
    }

    /* Dashboard Cards */
    .cms-section-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .cms-section-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(30, 97, 172, .04);
      transition: transform 0.2s;
    }

    .cms-section-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(30, 97, 172, .09);
      border-color: #CBD5E1;
    }

    .cms-section-index {
      font-size: 11px;
      font-weight: 800;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .cms-section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--navy);
      margin: 0 0 8px;
    }

    .cms-section-desc {
      font-size: 13px;
      color: var(--mute);
      margin: 0 0 16px;
      flex-grow: 1;
      line-height: 1.5;
    }

    .cms-metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .cms-metric-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .cms-metric-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--navy);
      display: block;
      line-height: 1.2;
    }

    .cms-metric-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--mute);
      text-transform: uppercase;
    }

    /* Tabs */
    .cms-tabs-nav {
      display: flex;
      border-bottom: 2px solid var(--line);
      margin-bottom: 24px;
      gap: 8px;
    }

    .cms-tab-btn {
      padding: 12px 20px;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      color: var(--mute);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cms-tab-btn:hover {
      color: var(--navy);
    }

    .cms-tab-btn.active {
      color: var(--navy);
      border-bottom-color: var(--navy);
    }

    /* Image Validation */
    .img-slot-card {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .img-slot-card.is-missing {
      border-color: #EF4444;
      background: #FFFBFB;
    }

    .img-slot-header {
      padding: 16px;
      background: #F8FAFC;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .img-slot-preview {
      height: 180px;
      background: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .img-slot-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .img-slot-specs {
      padding: 16px;
      font-size: 13px;
      color: #475569;
      background: #fff;
    }

    .cms-dropzone {
      border: 2px dashed #CBD5E1;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: #F8FAFC;
      cursor: pointer;
      position: relative;
      margin-top: 10px;
    }

    .cms-dropzone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* Tables */
    .table-wrap {
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-top: 16px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 720px;
    }

    th,
    td {
      text-align: left;
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    th {
      font-size: 11px;
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: .08em;
      background: #fafbfc;
    }

    .badge {
      display: inline-block;
      border-radius: 20px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge.green {
      background: #eef3e7;
      color: #41611e;
    }

    .badge.amber {
      background: #FFF7ED;
      color: #C2410C;
    }

    .badge.gray {
      background: #edf1f4;
      color: #51616d;
    }

    /* Marquee */
    .marquee-preview-wrap {
      background: #1E61AC;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      white-space: nowrap;
      display: flex;
    }

    .marquee-preview-track {
      display: inline-flex;
      animation: scrollLtr 15s linear infinite;
    }

    .marquee-preview-track span {
      padding-right: 40px;
      font-weight: 600;
    }

    @keyframes scrollLtr {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    @media(max-width:900px) {
      .cms-primary-modules-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .cms-metrics-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width:600px) {
      .cms-primary-modules-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .cms-metrics-row {
        grid-template-columns: 1fr;
      }
    }

  <div id="login" class="login-wrap">
    <div class="login-card">
      <a class="brand" href="./">ENPEE<small>INTERNATIONAL SCHOOL · KARAIKAL</small></a>

        <label>Password</label><input name="password" type="password" required>

      </form>
    </div>
  </div>

  <div id="app" class="app hidden">

        <button class="logout" id="logout">Sign out</button>
      </div>
    </header>
    <nav class="cms-primary-modules-grid" id="navigation"></nav>
    <main class="content" id="view"></main>
  </div>

    function getSectionRequiredSize(sectionId, slotKey, img) {
      const sec = (sectionId || '').toLowerCase();
      const slot = (slotKey || (img && img.slot) || '').toLowerCase();

      // The Way We Work & Academics: Strict 1200 x 900 px (4:3)
      if (sec === 'way-we-work' || sec === 'academics' || sec === 'programs' || sec === 'programs-offered') {
        return { width: 1200, height: 900, ratio: '4:3' };
      }

      // Hero Banner: 1920 x 600 px (3.2:1)
      if (sec === 'hero' || sec === 'banner') {
        return { width: 1920, height: 600, ratio: '3.2:1' };
      }

      const secConfig = REQUIRED_IMAGE_SPECS[sec];
      if (secConfig) {
        if (slot && secConfig[slot]) return secConfig[slot];
        if (slot && (slot.includes('banner') || slot.includes('full-width'))) {
          if (secConfig.banner) return secConfig.banner;
          if (secConfig.bannerImage) return secConfig.bannerImage;
          if (sec === 'advisory-board') return { width: 1920, height: 600, ratio: '3.2:1' };
          return { width: 1920, height: 800, ratio: '21:9' };
        }
        if (secConfig.default) return secConfig.default;
      }

      // Pattern-based fallbacks
      if (sec === 'technology-partners' || sec === 'infrastructure-providers' || sec === 'partners') {
        return { width: 400, height: 200, ratio: '2:1' };
      }
      if (sec === 'leadership' || sec === 'promoters' || sec === 'advisory-board') {
        if (slot.includes('banner')) return { width: 1920, height: 600, ratio: '3.2:1' };
        return { width: 600, height: 800, ratio: '3:4' };
      }
      if (sec === 'gallery' || sec === 'photo-gallery' || sec === 'activities') {
        return { width: 1200, height: 900, ratio: '4:3' };
      }
      if (sec === 'about' || sec === 'campus' || sec === 'sports' || sec === 'facilities') {
        return { width: 1200, height: 800, ratio: '3:2' };
      }

      if (img && img.requiredWidth && img.requiredHeight) {
        return { width: img.requiredWidth, height: img.requiredHeight, ratio: (img.requiredWidth / img.requiredHeight).toFixed(2) + ':1' };
      }

      return { width: 1200, height: 800, ratio: '3:2' };
    }

    // Client-side image dimension validation using new Image()
    function checkImageDimensions(file, reqW, reqH) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error('No image file selected.'));
        if (!file.type || !file.type.startsWith('image/')) {
          return reject(new Error('Please upload a valid image file.'));
        }
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          const actualWidth = img.naturalWidth || img.width;
          const actualHeight = img.naturalHeight || img.height;
          if (actualWidth !== reqW || actualHeight !== reqH) {
            const expectedRatio = reqW / reqH;
            const actualRatio = actualWidth / actualHeight;
            const ratioDiff = Math.abs(expectedRatio - actualRatio) / expectedRatio;
            if (ratioDiff <= 0.05) {
              return resolve({ width: actualWidth, height: actualHeight });
            }
            if (reqW === 1200 && reqH === 900) {
              const ratioDiff32 = Math.abs(1.5 - actualRatio) / 1.5;
              if (ratioDiff32 <= 0.05) {
                return resolve({ width: actualWidth, height: actualHeight });
              }
              const errMsg = 'Incorrect Image Size! Please upload an image with 4:3 aspect ratio (Recommended: 1200 x 900 pixels).';
              return reject(new Error(errMsg));
            }
            const errMsg = `Incorrect Image Size! Please upload an image with exact dimensions of ${reqW} x ${reqH} pixels. Your image is ${actualWidth} x ${actualHeight} pixels.`;
            return reject(new Error(errMsg));
          }
          resolve({ width: actualWidth, height: actualHeight });
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('Failed to load image for validation.'));
        };
        img.src = objectUrl;
      });
    }

      async function api(url, opts = {}) {
        const headers = new Headers(opts.headers || {});
        if (opts.body && !(opts.body instanceof FormData)) headers.set('Content-Type', 'application/json');
        if (state.csrf && opts.method && opts.method !== 'GET') headers.set('X-CSRF-Token', state.csrf);

        const res = await fetch(url, { ...opts, headers, credentials: 'same-origin' });
        const type = res.headers.get('content-type') || '';
        const data = type.includes('application/json') ? await res.json() : await res.text();
        if (!res.ok) { if (res.status === 401) showLogin(); throw new Error(data.error || ('Failed (' + res.status + ')')); }
        return data;
      }

            if (items.length > 0) {
              cardsHtml = `
            <h4 style="margin:25px 0 10px; font-size:16px;">Cards in this Section</h4>
            <p class="muted">Edit card titles for each item shown on the website. Changes update SQLite and index.html immediately.</p>
            <div style="display:flex; flex-direction:column; gap:12px; margin-top:12px;">
              ${items.map(item => `
                <div style="display:flex; align-items:center; gap:14px; padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff;">
                  ${item.image ? `<img src="${escapeHtml(item.image)}" style="width:52px; height:52px; object-fit:cover; border-radius:6px; border:1px solid var(--line);" alt="" />` : `<div style="width:52px; height:52px; background:#eef3f6; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:11px;">No Img</div>`}
                  <div style="flex:1;">
                    <label style="font-weight:600; font-size:12px; margin:0 0 4px; display:block;">Card Title</label>
                    <input class="collection-title-input" data-item-id="${escapeHtml(item.itemId)}" data-collection="${escapeHtml(item.collection)}" value="${escapeHtml(item.title || '')}" style="width:100%;" />
                  </div>
                  ${item.description !== undefined ? `
                    <div style="flex:1;">
                      <label style="font-weight:600; font-size:12px; margin:0 0 4px; display:block;">Description / Subtitle</label>
                      <input class="collection-desc-input" data-item-id="${escapeHtml(item.itemId)}" value="${escapeHtml(item.description || '')}" style="width:100%;" />
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          `;
            }

            panel.innerHTML = `
          <h3>Edit Content</h3>
          <p class="muted">Make changes below. Changes are saved to SQLite and update the live website immediately.</p>
          <form id="content-form" style="max-width:700px; margin-top:20px;">
            ${fieldsHtml}
            ${cardsHtml}
            <div style="margin-top:24px;"><button type="submit" class="btn green">Save Changes</button></div>
          </form>
        `;

            $('#content-form').addEventListener('submit', async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              const newContent = {};
              for (let [key, val] of fd.entries()) newContent[key] = val;

              const titleInputs = panel.querySelectorAll('.collection-title-input');
              const updatedItems = [];
              titleInputs.forEach(input => {
                const itemId = input.dataset.itemId;
                const descInput = panel.querySelector('.collection-desc-input[data-item-id="' + itemId + '"]');
                updatedItems.push({
                  itemId: itemId,
                  collection: input.dataset.collection,
                  title: input.value,
                  description: descInput ? descInput.value : undefined
                });
              });

              if (sec.id === 'about') {
                newContent.title = newContent.heading;
                newContent.introduction = newContent.intro;
              } else if (sec.id === 'promoters') {
                newContent.title = newContent.heading;
              } else if (sec.id === 'advisory-board') {
                newContent.title = newContent.heading;
              } else if (sec.id === 'way-we-work') {
                newContent.title = newContent.heading;
                newContent.introduction = newContent.intro;
                newContent.curriculumText = newContent.curriculum;
                newContent.marinersStarText = newContent.marinersStar;
              }

              try {
                await api('/api/admin/sections/' + sec.id + '/details', {
                  method: 'PUT',
                  body: JSON.stringify({ content: newContent, items: updatedItems })
                });

                if (updatedItems.length > 0) {
                  for (const it of updatedItems) {
                    try {
                      await api('/api/admin/collections/' + it.collection + '/' + it.itemId, {
                        method: 'PUT',
                        body: JSON.stringify({ title: it.title, description: it.description })
                      });
                    } catch { }
                  }
                }

                alert('Content saved! The website is updated.');
              } catch (err) {
                alert('Error saving content: ' + err.message);
              }
            });
          } catch (e) { panel.innerHTML = '<p style="color:red">' + escapeHtml(e.message) + '</p>'; }
        }
        else if (tab === 'images') {
          panel.innerHTML = '<h3>Loading images...</h3>';
          try {
            const data = await api('/api/admin/sections/' + sec.id + '/details');
            const images = data.images || [];

            const addReqSize = getSectionRequiredSize(sec.id, 'add');

            panel.innerHTML = `
          <h3>${sec.id === 'technology-partners' ? 'Manage Technology Partner Logos' : (sec.id === 'infrastructure-providers' ? 'Manage Infrastructure Provider Logos' : (sec.id === 'about' ? 'Manage About Page Images' : (sec.id === 'promoters' ? 'Manage Promoters Images' : (sec.id === 'advisory-board' ? 'Manage Advisory Board Images' : (sec.id === 'way-we-work' ? 'Manage "The Way We Work" Images (4 Feature Cards)' : (sec.id === 'programs-offered' ? 'Manage "Programs Offered" Page Images' : (sec.id === 'gallery' ? 'Manage Campus Life – "Moments at ENPEE" Gallery Images' : (sec.id === 'activities' ? 'Manage Activities – "Learning Beyond the Classroom" Images' : 'Manage Images'))))))))}</h3>
          <p class="muted">${sec.id === 'technology-partners' || sec.id === 'infrastructure-providers' ? 'Replace or upload logos for each partner and infrastructure provider.' : (sec.id === 'about' ? 'Replace images for the Admission Circular, Video Tour, Poster, and Campus Highlights.' : (sec.id === 'promoters' ? 'Replace images for National Pharma Facility, Founder Rtn. PHF. Hajee L. Kamal Batcha, and Hospital & Research Institute.' : (sec.id === 'advisory-board' ? 'Replace images for the Top Banner and Advisor Profiles.' : (sec.id === 'way-we-work' ? 'Replace the 4 feature card images on this page: Card 1 (NCERT & Curriculum), Card 2 (Extra Curricular Activities), Card 3 (Robotics & Innovation), and Card 4 (Mariner\'s Star).' : (sec.id === 'programs-offered' ? 'Replace images for Banner, Kindergarten, Primary & Middle School, Robotics & Coding Lab, Sports Academy, etc.' : (sec.id === 'gallery' ? 'Preview, replace, or delete existing Moments at ENPEE photos, or upload new moments to the gallery.' : (sec.id === 'activities' ? 'Preview, replace, or delete photos for the 8 student activities (Football, Basketball, Skating, Yoga, Dance, Art & Craft, Robotics, Indoor Games), or add new activity images.' : 'Preview, replace, or delete existing card and banner images, or add new images.')))))))}</p>
          
          <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; margin-top:20px;">
            ${images.length > 0 ? images.map(img => {
              const reqSize = getSectionRequiredSize(sec.id, img.slot, img);
              return `
              <div class="img-slot-card" style="border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff;">
                <div class="img-slot-preview" style="height:160px; background:#f0f4f8; display:flex; align-items:center; justify-content:center; overflow:hidden;">
                  ${img.url ? `
                    <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.title || 'Section Image')}" style="width:100%; height:160px; object-fit:${(sec.id === 'technology-partners' || sec.id === 'infrastructure-providers') ? 'contain; padding:10px; background:#fff;' : 'cover;'}">
                  ` : `
                    <span style="color:var(--mute); font-size:13px;">No logo uploaded</span>
                  `}
                </div>
                <div class="img-slot-specs" style="padding:14px;">
                  <b style="font-size:14px; display:block; margin-bottom:6px;">${escapeHtml(img.title || 'Image Slot')}</b>
                  <p style="color:#e53e3e; font-weight:700; font-size:12px; margin:4px 0 8px 0; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <span>Required Size:</span>
                    <span style="background:#fff5f5; border:1px solid #feb2b2; padding:3px 10px; border-radius:4px; font-family:monospace; font-weight:700; font-size:12px; color:#c53030;">${reqSize.width} x ${reqSize.height} px (${reqSize.ratio === '4:3' ? '4:3 Ratio' : reqSize.ratio})</span>
                  </p>
                  <div style="display:flex; gap:8px; margin-top:10px;">
                    <button class="btn light small" data-replace="${escapeHtml(img.slot)}">Replace Image</button>
                    <button class="btn danger small" data-delete="${escapeHtml(img.slot)}">Delete</button>
                  </div>
                  <input type="file" accept="image/*" data-replace-input="${escapeHtml(img.slot)}" data-req-width="${reqSize.width}" data-req-height="${reqSize.height}" style="display:none;" />
                </div>
              </div>
            `;
            }).join('') : '<p class="muted">No images uploaded yet.</p>'}
          </div>

          <hr style="margin:30px 0; border:0; border-top:1px solid var(--line);">
          <h3>Add New Image</h3>
          <p class="muted">Upload a new image to append to this section.</p>
          <div class="cms-dropzone" style="margin-top:12px;">
            <input type="file" accept="image/*" id="add-img-input" data-req-width="${addReqSize.width}" data-req-height="${addReqSize.height}" />
            <p>Click to select an image from your computer</p>
            <p style="color:#e53e3e; font-weight:700; font-size:12px; margin-top:8px;">
              Required Size: <span style="background:#fff5f5; border:1px solid #feb2b2; padding:3px 10px; border-radius:4px; font-family:monospace; font-weight:700; font-size:12px; color:#c53030;">${addReqSize.width} x ${addReqSize.height} px (${addReqSize.ratio === '4:3' ? '4:3 Ratio' : addReqSize.ratio})</span>
            </p>
          </div>
        `;

            panel.querySelectorAll('[data-replace]').forEach(btn => {
              btn.addEventListener('click', () => {
                const slot = btn.dataset.replace;
                const input = panel.querySelector('[data-replace-input="' + slot + '"]');
                if (input) input.click();
              });
            });

            panel.querySelectorAll('[data-replace-input]').forEach(input => {
              input.addEventListener('change', async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                const reqW = parseInt(input.dataset.reqWidth, 10);
                const reqH = parseInt(input.dataset.reqHeight, 10);

                // Client-Side Dimension Validation
                try {
                  await checkImageDimensions(file, reqW, reqH);
                } catch (valErr) {
                  alert(valErr.message);
                  input.value = ''; // Reset input to allow selecting again
                  return; // Prevent upload!
                }

                const fd = new FormData();
                fd.append('image', file);
                try {
                  await api('/api/admin/sections/' + sec.id + '/images/' + input.dataset.replaceInput, { method: 'POST', body: fd });
                  alert('Image replaced successfully!');
                  renderTab(panel, 'images', sec);
                } catch (err) {
                  alert(err.message);
                  input.value = '';
                }
              });
            });

            panel.querySelectorAll('[data-delete]').forEach(btn => {
              btn.addEventListener('click', async () => {
                if (!confirm('Delete this image? This cannot be undone.')) return;
                try {
                  await api('/api/admin/sections/' + sec.id + '/images/' + btn.dataset.delete, { method: 'DELETE' });
                  alert('Image deleted!');
                  renderTab(panel, 'images', sec);
                } catch (err) { alert(err.message); }
              });
            });

            const addInput = $('#add-img-input');
            if (addInput) {
              addInput.addEventListener('change', async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                const reqW = parseInt(addInput.dataset.reqWidth, 10);
                const reqH = parseInt(addInput.dataset.reqHeight, 10);

                // Client-Side Dimension Validation
                try {
                  await checkImageDimensions(file, reqW, reqH);
                } catch (valErr) {
                  alert(valErr.message);
                  addInput.value = ''; // Reset input to allow selecting again
                  return; // Prevent upload!
                }

                const fd = new FormData();
                fd.append('image', file);
                try {
                  await api('/api/admin/sections/' + sec.id + '/images/add', { method: 'POST', body: fd });
                  alert('Image added successfully!');
                  renderTab(panel, 'images', sec);
                } catch (err) {
                  alert(err.message);
                  addInput.value = '';
                }
              });
            }

          } catch (e) { panel.innerHTML = '<p style="color:red">' + escapeHtml(e.message) + '</p>'; }
        }
        else if (tab === 'marquee') {
          panel.innerHTML = `<h3>Loading marquee settings...</h3>`;
          try {
            const data = await api('/api/admin/marquee');
            const items = data.items || [];

            panel.innerHTML = `
          <h3>Notice Marquee Settings</h3>
          <p class="muted">Manage the scrolling announcements displayed at the top of the website.</p>
          
          <label style="display:flex; gap:10px; align-items:center; font-weight:bold; margin-bottom:20px; margin-top:20px;">
            <input type="checkbox" id="marquee-enabled" ${data.enabled ? 'checked' : ''} style="width:auto;" /> 
            Enable Notice Marquee on Website
          </label>
          
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:20px;">
            <div><label>Scroll Speed (seconds)</label><input type="number" id="marquee-speed" value="${data.speed}" /></div>
            <div><label>Start Date (Optional)</label><input type="datetime-local" id="marquee-start" value="${data.startDate || ''}" /></div>
            <div><label>End Date (Optional)</label><input type="datetime-local" id="marquee-end" value="${data.endDate || ''}" /></div>
          </div>
          
          <hr style="margin: 20px 0; border:0; border-top:1px solid var(--line);">
          
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div>
              <h3 style="margin:0;">Announcements (<span id="marquee-count">${items.length}</span>)</h3>
              <p class="muted" style="margin:5px 0 0 0;">Active announcements scroll continuously across the top notice bar.</p>
            </div>
            <button class="btn green" id="add-marquee-item">+ Add Announcement</button>
          </div>
          
          <div id="marquee-items-list" style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px;">
            ${items.map((item, index) => `
              <div class="marquee-item-row" style="display:flex; gap:12px; align-items:center; background:#f8fafc; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                <input type="text" class="marquee-text-input" value="${escapeHtml(item.text)}" style="flex:1; padding:10px;" placeholder="Enter announcement text..." />
                <label style="display:flex; align-items:center; gap:5px; white-space:nowrap;">
                  <input type="checkbox" class="marquee-item-enabled" ${item.enabled ? 'checked' : ''} style="width:auto;" /> Active
                </label>
                <button type="button" class="btn danger delete-marquee-item">Delete</button>
              </div>
            `).join('')}
          </div>
          
          <div style="margin-top:20px;">
            <button class="btn green" id="save-marquee">Save All Settings</button>
          </div>
        `;

            // Function to update the count
            const updateCount = () => {
              const count = panel.querySelectorAll('.marquee-item-row').length;
              const countEl = $('#marquee-count');
              if (countEl) countEl.textContent = count;
            };

            // Add new item logic
            $('#add-marquee-item').addEventListener('click', () => {
              const list = $('#marquee-items-list');
              const div = document.createElement('div');
              div.className = 'marquee-item-row';
              div.style.cssText = 'display:flex; gap:12px; align-items:center; background:#f8fafc; padding:10px; border:1px solid #e2e8f0; border-radius:8px;';
              div.innerHTML = `
            <input type="text" class="marquee-text-input" placeholder="Enter new announcement..." style="flex:1; padding:10px;" />
            <label style="display:flex; align-items:center; gap:5px; white-space:nowrap;">
              <input type="checkbox" class="marquee-item-enabled" checked style="width:auto;" /> Active
            </label>
            <button type="button" class="btn danger delete-marquee-item">Delete</button>
          `;
              list.appendChild(div);
              updateCount();

              // Attach delete listener to the new button
              div.querySelector('.delete-marquee-item').addEventListener('click', () => {
                div.remove();
                updateCount();
              });
            });

            // Delete item logic for existing items
            panel.querySelectorAll('.delete-marquee-item').forEach(btn => {
              btn.addEventListener('click', (e) => {
                e.target.closest('.marquee-item-row').remove();
                updateCount();
              });
            });

            // Save logic
            $('#save-marquee').addEventListener('click', async () => {
              const enabled = $('#marquee-enabled').checked;
              const speed = parseInt($('#marquee-speed').value, 10) || 20;
              const startDate = $('#marquee-start').value;
              const endDate = $('#marquee-end').value;

              const itemsList = [];
              panel.querySelectorAll('.marquee-item-row').forEach(row => {
                const text = row.querySelector('.marquee-text-input').value.trim();
                const isEnabled = row.querySelector('.marquee-item-enabled').checked;
                if (text) itemsList.push({ text, enabled: isEnabled });
              });

              try {
                await api('/api/admin/marquee', {
                  method: 'PUT',
                  body: JSON.stringify({ enabled, speed, startDate, endDate, items: itemsList })
                });
                alert('Marquee settings saved successfully!');
                renderTab(panel, 'marquee', sec);
              } catch (err) {
                alert('Error saving: ' + err.message);
              }
            });

          } catch (e) {
            panel.innerHTML = `<p style="color:red">Error loading marquee: ${escapeHtml(e.message)}</p>`;
          }
        }
        else if (tab === 'pdfs') {
          panel.innerHTML = `
        <h3>PDF Management</h3>
        <p class="muted">Upload PDF documents for parents and students to download.</p>
        <div class="cms-dropzone" style="margin-top:20px;">
          <input type="file" accept=".pdf" id="pdf-input" />
          <p>Click to choose PDF file</p>
        </div>
        <div style="margin-top:20px;"><button class="btn green" id="upload-pdf-btn">Upload PDF</button></div>
      `;
          $('#upload-pdf-btn').addEventListener('click', async () => {
            const input = $('#pdf-input');
            if (!input.files || !input.files[0]) return alert('Select a PDF first.');
            const fd = new FormData(); fd.append('pdf', input.files[0]);
            try {
              const res = await api('/api/admin/sections/' + sec.id + '/pdfs', { method: 'POST', body: fd });
              alert('PDF uploaded successfully: ' + res.title);
            } catch (err) { alert(err.message); }
          });
        }
      }

      async function renderEnquiries(view) {
        view.innerHTML = '<div class="panel">Loading enquiries...</div>';
        try {
          const data = await api('/api/admin/enquiries');
          const items = data.items || [];
          view.innerHTML = `
        <div class="section-heading"><div><h2>Admission Enquiries</h2><div class="help">Process and manage incoming student enquiries.</div></div></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Parent</th><th>Student</th><th>Phone</th><th>Class</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td><b>${escapeHtml(item.parent_name)}</b></td>
                  <td>${escapeHtml(item.student_name)}</td>
                  <td>${escapeHtml(item.mobile)}</td>
                  <td>${escapeHtml(item.applying_class)}</td>
                  <td>
                    <select data-enquiry-id="${item.id}" class="enquiry-status">
                      ${['New', 'Contacted', 'Completed'].map(s => `<option value="${s}" ${item.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                  </td>
                  <td><button class="btn danger small" data-delete-id="${item.id}">Delete</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
          view.querySelectorAll('.enquiry-status').forEach(select => {
            select.addEventListener('change', async (e) => {
              try {
                await api('/api/admin/enquiries/' + select.dataset.enquiryId, { method: 'PATCH', body: JSON.stringify({ status: e.target.value }) });
              } catch (err) { alert(err.message); }
            });
          });
          view.querySelectorAll('[data-delete-id]').forEach(btn => {
            btn.addEventListener('click', async () => {
              if (!confirm('Delete this enquiry?')) return;
              try {
                await api('/api/admin/enquiries/' + btn.dataset.deleteId, { method: 'DELETE' });
                navigate('enquiries');
              } catch (err) { alert(err.message); }
            });
          });
        } catch (e) { view.innerHTML = '<p style="color:red">' + escapeHtml(e.message) + '</p>'; }
      }

      $('#login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }) });
          state.csrf = res.csrfToken; state.email = res.email; showApp();
        } catch (err) { $('#login-error').textContent = err.message; }
      });

      $('#logout').addEventListener('click', async () => {
        try { await api('/api/auth/logout', { method: 'POST' }); } catch { }
        showLogin();
      });

      (async () => {
        try { const u = await api('/api/auth/me'); state.csrf = u.csrfToken; state.email = u.email; showApp(); }
        catch { showLogin(); }
      })();
  </script>
</body>

</html>
